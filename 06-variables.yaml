- name: demo on task level variables
  hosts: local
  connection: local
  vars:
    property: "100 acres"
    
  tasks:
  - name: print the variables
    debug:
      msg: "Hi, I've received {{ property }} from my grand parents"
  
  - name: print the variables
    property: "10 acres"
    debug:
      msg: "Hi, I've got {{ property }} from my grand father"
