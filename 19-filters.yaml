- name: demo on filters
  hosts: local
  connection: local
  vars:
    topics: "Linux, Shell, Ansibl, Terraform, Docker"
    names:
    - Shravan
    - Kumar
    - Mailaram
    topic: ANSIBLE
    duration: "4"
  tasks:
  - name: print the name
    debug:
      msg: "Hi, {{ person_name | default('Ramesh') }}"

  - name: convert string to list
    debug:
      msg: "Topics are: {{ topics | split(',') | trim }}" 

  - name: convert list to string
    debug:
      msg: "Full Name is {{ names | join(' ') }}"

  - name: convert to lower case
    debug:
      msg: "Topic: {{ topic | lower }}"
  - name: convert string to int
    debug:
      msg: "Duration: {{ duration | int }}"